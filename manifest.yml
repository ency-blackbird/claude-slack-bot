display_information:
  name: skunk
  description: Claude Code, driven from Slack
features:
  bot_user:
    display_name: skunk
    always_online: true
  slash_commands:
    - command: /list
      description: Re-pin active sessions
      should_escape: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - commands
      - channels:history
      - channels:read
      - pins:write
      - groups:history
      - groups:read
settings:
  socket_mode_enabled: true
  interactivity:
    is_enabled: true
  event_subscriptions:
    bot_events:
      - message.channels
      - message.groups
      - app_mention
  org_deploy_enabled: false
